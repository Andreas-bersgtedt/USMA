[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-synapse-migration-analyzer"
version = "5.2.0"
description = "Analyze Azure Synapse Analytics workspaces to assess Microsoft Fabric Warehouse migration readiness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Bergstedt" }]
maintainers = [{ name = "Andreas Bergstedt" }]
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-synapse>=2.0.0",
    "azure-mgmt-datafactory>=9.0.0",  # Phase 2 — ADF as second source
    "azure-mgmt-resource>=23.1",
    "azure-mgmt-monitor>=6.0.2",
    "azure-mgmt-storage>=21.1.0",
    "azure-synapse-artifacts>=0.20",
    "azure-synapse-spark>=0.7",
    "pyodbc>=5.1",
    "pydantic>=2.7",
    "rich>=13.7",
    "click>=8.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "six>=1.16",            # transitive dep needed by azure-mgmt-synapse models
    "sqlglot>=23.0",        # AST-based T-SQL parser for workload analysis
]

[project.optional-dependencies]
cost = [
    "azure-mgmt-costmanagement>=4.0",
]
# Phase 4 / 4.7 — Databricks source (Azure + AWS). Optional because
# `databricks-sdk` pulls in `databricks-sql-connector` which depends on
# `pyarrow` (heavy). `databricks-sdk>=0.30` is the floor for
# `databricks.sdk.AccountClient`, which the Phase 4.7 AWS Account-API
# discovery path relies on. `azure-mgmt-databricks` stays for the
# Azure-only ARM probe in `DatabricksProvider`.
databricks = [
    "azure-mgmt-databricks>=2.0",
    "databricks-sdk>=0.30",
]
# Phase 5 — Google BigQuery source. Optional because the Google Cloud
# client libraries pull in `grpcio` + `protobuf` (heavy). Auth is via
# Application Default Credentials (`google.auth.default()`); no AAD.
bigquery = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-resource-manager>=1.13",
    "google-cloud-logging>=3.12",
    "google-cloud-bigquery-datatransfer>=3.15",
    "google-auth>=2.30",
    # Slice 5-I — installed-app OAuth flow surfaced via the SPA so users
    # without gcloud CLI can produce an ADC user-credentials file from a
    # browser sign-in (`POST /api/auth/gcp/login`).
    "google-auth-oauthlib>=1.2",
]
# Phase 6+ — SAP BW source. Requires the SAP NetWeaver RFC SDK installed
# on the host (license-restricted), so `pyrfc` is opt-in.
sapbw = [
    "pyrfc>=3.3",
]
# Phase 7 — Snowflake source. Optional because `snowflake-connector-python`
# pulls in `pyarrow` (heavy). OAuth (refresh-token grant) is the
# auth flow; access tokens are exchanged via the stdlib `urllib.request`,
# so no extra crypto dependencies are required.
# Snowpark is intentionally NOT pinned here — inventory + ACCOUNT_USAGE
# queries run via the connector alone; Snowpark deep-dive (if added) goes
# behind a separate `[snowflake-snowpark]` extra.
snowflake = [
    "snowflake-connector-python>=3.7",
]
# Future Phase 6 — SQL Server / SSIS. `pyodbc` is already core, but
# the SSIS package parser needs lxml. Opt-in to keep the default
# install lean.
ssis = [
    "lxml>=5.2",
]
web = [
    # Optional control-plane backend for `sma serve --with-api`. Kept out
    # of the default install so the CLI footprint stays small.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.115",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Bring all source-provider deps into dev so the full test suite
    # (including Databricks + BigQuery provider unit tests) runs without
    # extra install steps. Optional extras stay opt-in for end-users.
    "azure-mgmt-databricks>=2.0",
    "databricks-sdk>=0.30",
    "google-cloud-bigquery>=3.25",
    "google-cloud-resource-manager>=1.13",
    "google-cloud-logging>=3.12",
    "google-cloud-bigquery-datatransfer>=3.15",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    # Phase 7 — Snowflake provider tests need the connector.
    "snowflake-connector-python>=3.7",
]

[project.scripts]
# Phase 3 (D2) — USMA rename. ``usma`` is the new canonical entry point;
# ``sma`` stays available for one minor release after the Phase-3
# package rename (PR #1, completed), then is removed. Both point at
# the same callable so existing user scripts keep working during the
# deprecation window.
usma = "usma.cli:main"
sma = "usma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usma", "src/synapse_migration_analyzer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
